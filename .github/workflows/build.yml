name: Secure Lock APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Anahtar
        run: |
          if [ ! -f signing/release.jks ]; then
            mkdir -p signing
            keytool -genkeypair -keystore signing/release.jks -storepass securelock -keypass securelock -alias sl -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Secure Lock" || true
            git config user.name "build"
            git config user.email "build@example.com"
            git add signing/release.jks || true
            git commit -m "anahtar" || true
            git push || true
          fi
      - name: Dosyalari olustur
        run: |
          mkdir -p SecureLock/app/src/main/java/com/securelock SecureLock/app/src/main/res/xml SecureLock/app/src/main/res/values SecureLock/app/src/main/res/drawable
          cd SecureLock
          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "SecureLock"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
            id("com.android.application") version "8.5.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
          }
          val ks = file(System.getenv("GITHUB_WORKSPACE") + "/signing/release.jks")
          android {
            namespace = "com.securelock"
            compileSdk = 34
            signingConfigs {
              create("sl") {
                storeFile = ks
                storePassword = "securelock"
                keyAlias = "sl"
                keyPassword = "securelock"
              }
            }
            defaultConfig {
              applicationId = "com.securelock"
              minSdk = 26
              targetSdk = 34
              versionCode = 4
              versionName = "0.4"
            }
            buildTypes {
              getByName("debug") {
                if (ks.exists()) signingConfig = signingConfigs.getByName("sl")
              }
            }
            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
          }
          EOF
          
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
            <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
            <queries>
              <intent>
                <action android:name="android.intent.action.MAIN" />
              </intent>
            </queries>
            <application
              android:label="Secure Lock"
              android:icon="@android:drawable/ic_lock_lock"
              android:allowBackup="false"
              android:theme="@android:style/Theme.Material.NoActionBar">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:excludeFromRecents="true"
                android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
              <service
                android:name=".LockService"
                android:exported="true"
                android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                <intent-filter>
                  <action android:name="android.accessibilityservice.AccessibilityService" />
                </intent-filter>
                <meta-data
                  android:name="android.accessibilityservice"
                  android:resource="@xml/accessibility_config" />
              </service>
              <receiver
                android:name=".MyDeviceAdminReceiver"
                android:permission="android.permission.BIND_DEVICE_ADMIN"
                android:exported="true">
                <meta-data
                  android:name="android.app.device_admin"
                  android:resource="@xml/device_admin_receiver" />
                <intent-filter>
                  <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                </intent-filter>
              </receiver>
            </application>
          </manifest>
          EOF
          
          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:notificationTimeout="0"
            android:canRetrieveWindowContent="true"
            android:description="Secure Lock uygulama kilidi" />
          EOF
          
          cat > app/src/main/res/xml/device_admin_receiver.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <force-lock />
              </uses-policies>
          </device-admin>
          EOF
          
          cat > app/src/main/java/com/securelock/Store.kt <<'EOF'
          package com.securelock
          import android.content.Context
          import android.util.Base64
          import java.security.MessageDigest
          import java.security.SecureRandom
          import javax.crypto.SecretKeyFactory
          import javax.crypto.spec.PBEKeySpec

          object Store {
            private fun p(c: Context) = c.applicationContext.getSharedPreferences("sl", Context.MODE_PRIVATE)
            private fun hash(pin: String, salt: ByteArray): ByteArray {
              val spec = PBEKeySpec(pin.toCharArray(), salt, 60000, 256)
              return SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256").generateSecret(spec).encoded
            }
            fun hasPin(c: Context): Boolean = p(c).contains("hash")
            fun setPin(c: Context, pin: String) {
              val salt = ByteArray(16)
              SecureRandom().nextBytes(salt)
              p(c).edit()
                .putString("salt", Base64.encodeToString(salt, Base64.NO_WRAP))
                .putString("hash", Base64.encodeToString(hash(pin, salt), Base64.NO_WRAP))
                .putInt("fails", 0)
                .putLong("until", 0L)
                .apply()
            }
            fun check(c: Context, pin: String): Boolean {
              val sp = p(c)
              val salt = Base64.decode(sp.getString("salt", "") ?: "", Base64.NO_WRAP)
              val want = Base64.decode(sp.getString("hash", "") ?: "", Base64.NO_WRAP)
              return MessageDigest.isEqual(want, hash(pin, salt))
            }
            fun waitSeconds(c: Context): Long {
              val left = p(c).getLong("until", 0L) - System.currentTimeMillis()
              return if (left > 0) (left + 999) / 1000 else 0L
            }
            fun fail(c: Context) {
              val sp = p(c)
              val n = sp.getInt("fails", 0) + 1
              val delay = when { n >= 15 -> 3600L; n >= 10 -> 900L; n >= 5 -> 120L; n >= 3 -> 30L; else -> 0L }
              val until = if (delay > 0) System.currentTimeMillis() + delay * 1000 else 0L
              sp.edit().putInt("fails", n).putLong("until", until).apply()
            }
            fun ok(c: Context) { p(c).edit().putInt("fails", 0).putLong("until", 0L).apply() }
            fun locked(c: Context): Set<String> = p(c).getStringSet("locked", emptySet()) ?: emptySet()
            fun setLocked(c: Context, pkg: String, on: Boolean) {
              val s = HashSet<String>(locked(c))
              if (on) s.add(pkg) else s.remove(pkg)
              p(c).edit().putStringSet("locked", s).apply()
            }
            fun setMany(c: Context, pkgs: Collection<String>, on: Boolean) {
              val s = HashSet<String>(locked(c))
              if (on) s.addAll(pkgs) else s.removeAll(pkgs.toSet())
              p(c).edit().putStringSet("locked", s).apply()
            }
            fun setTimeLock(c: Context, pkg: String, hours: Int) {
                val endTime = System.currentTimeMillis() + (hours * 3600000L)
                p(c).edit().putLong("timelock_$pkg", endTime).apply()
            }
            fun getTimeLockEnd(c: Context, pkg: String): Long = p(c).getLong("timelock_$pkg", 0L)
          }
          EOF
          
          cat > app/src/main/java/com/securelock/MyDeviceAdminReceiver.kt <<'EOF'
          package com.securelock
          import android.app.admin.DeviceAdminReceiver
          class MyDeviceAdminReceiver : DeviceAdminReceiver()
          EOF

          cat > app/src/main/java/com/securelock/LockService.kt <<'EOF'
          package com.securelock
          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.inputmethod.InputMethodManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView

          class LockService : AccessibilityService() {
            private val unlocked = HashSet<String>()
            private val ignore = HashSet<String>()
            private val homes = HashSet<String>()
            private var current = ""
            private var overlay: View? = null
            private var overlayPkg = ""

            private fun wm(): WindowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager

            override fun onServiceConnected() {
              super.onServiceConnected()
              ignore.clear()
              ignore.add("com.android.systemui")
              val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
              for (m in imm.enabledInputMethodList) ignore.add(m.packageName)
              homes.clear()
              val q = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME)
              for (r in packageManager.queryIntentActivities(q, 0)) homes.add(r.activityInfo.packageName)
            }

            override fun onAccessibilityEvent(e: AccessibilityEvent?) {
              if (e == null || e.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
              val pkg = e.packageName?.toString() ?: return
              if (pkg == packageName && overlay != null) return
              if (pkg in ignore) return
              if (pkg != current) { unlocked.remove(current); current = pkg }
              
              val isLocked = pkg in Store.locked(this)
              val isTimeLocked = System.currentTimeMillis() < Store.getTimeLockEnd(this, pkg)
              
              if (isLocked && (isTimeLocked || pkg !in unlocked)) {
                  show(pkg, isTimeLocked)
              } else {
                  hide()
              }
            }

            private fun show(pkg: String, isTimeLocked: Boolean) {
              if (overlay != null && overlayPkg == pkg) return
              hide()
              overlayPkg = pkg

              val root = LinearLayout(this)
              root.orientation = LinearLayout.VERTICAL
              root.gravity = Gravity.CENTER
              root.setBackgroundColor(Color.parseColor("#121212"))
              root.setPadding(60, 60, 60, 60)

              if (isTimeLocked) {
                  val end = Store.getTimeLockEnd(this, pkg)
                  val hoursLeft = (end - System.currentTimeMillis()) / 3600000L
                  val minsLeft = ((end - System.currentTimeMillis()) % 3600000L) / 60000L
                  
                  val tv = TextView(this)
                  tv.text = "ZAMAN KİLİDİ AKTİF\n\nKalan Süre: ${hoursLeft} Saat ${minsLeft} Dakika\n\nLütfen sürenin dolmasını bekleyin."
                  tv.setTextColor(Color.WHITE); tv.textSize = 22f; tv.gravity = Gravity.CENTER
                  root.addView(tv)
              } else {
                  val title = TextView(this)
                  title.text = "Secure Lock"
                  title.setTextColor(Color.WHITE); title.textSize = 28f; title.gravity = Gravity.CENTER
                  title.setPadding(0,0,0,20)
                  root.addView(title)

                  val sub = TextView(this)
                  sub.text = "Şifrenizi girin"
                  sub.setTextColor(Color.GRAY); sub.textSize = 16f; sub.gravity = Gravity.CENTER
                  sub.setPadding(0,0,0,30)
                  root.addView(sub)

                  val input = EditText(this)
                  input.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  input.hint = "PIN veya Şifre"
                  input.setHintTextColor(Color.GRAY)
                  input.setTextColor(Color.WHITE)
                  input.textSize = 20f
                  input.gravity = Gravity.CENTER
                  input.setPadding(30, 30, 30, 30)
                  val bg = GradientDrawable()
                  bg.setColor(Color.parseColor("#1E1E1E"))
                  bg.cornerRadius = 30f
                  input.background = bg
                  root.addView(input, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))

                  val msg = TextView(this)
                  msg.setTextColor(Color.parseColor("#FF6B6B")); msg.textSize = 14f; msg.gravity = Gravity.CENTER
                  msg.setPadding(0, 20, 0, 20)
                  root.addView(msg)

                  val btn = Button(this)
                  btn.text = "Kilidi Aç"
                  btn.setTextColor(Color.WHITE)
                  val btnBg = GradientDrawable()
                  btnBg.setColor(Color.parseColor("#3F51B5"))
                  btnBg.cornerRadius = 30f
                  btn.background = btnBg
                  root.addView(btn, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))

                  btn.setOnClickListener {
                      val w = Store.waitSeconds(this)
                      if (w > 0) { msg.text = "Bekleyin: $w sn"; return@setOnClickListener }
                      if (Store.check(this, input.text.toString())) {
                          Store.ok(this); unlocked.add(overlayPkg); hide()
                      } else {
                          Store.fail(this); input.setText("")
                          msg.text = "Yanlış Şifre"
                      }
                  }
                  
                  input.requestFocus()
                  val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                  imm.showSoftInput(input, InputMethodManager.SHOW_IMPLICIT)
              }

              overlay = root
              val lp = WindowManager.LayoutParams(
                WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_SECURE, PixelFormat.OPAQUE
              )
              try { wm().addView(root, lp) } catch (ex: Exception) { overlay = null }
            }

            private fun hide() {
              val o = overlay ?: return; overlay = null
              try { wm().removeView(o) } catch (ex: Exception) {}
            }
            override fun onInterrupt() {}
            override fun onDestroy() { hide(); super.onDestroy() }
          }
          EOF

          cat > app/src/main/java/com/securelock/MainActivity.kt <<'EOF'
          package com.securelock
          import android.app.Activity
          import android.app.admin.DevicePolicyManager
          import android.content.ComponentName
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.Settings
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Switch
          import android.widget.TextView

          class AppItem(val pkg: String, val name: String, val icon: Drawable)

          class MainActivity : Activity() {
            private var firstPin = ""
            private var allApps: List<AppItem> = emptyList()
            private var query = ""
            private var listBox: LinearLayout? = null

            private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()
            override fun onCreate(b: Bundle?) {
              super.onCreate(b)
              window.statusBarColor = Color.BLACK; window.navigationBarColor = Color.BLACK
            }
            override fun onStart() {
              super.onStart()
              if (Store.hasPin(this)) showGate() else showSetup()
            }
            override fun onStop() { super.onStop(); setContentView(View(this).apply { setBackgroundColor(Color.BLACK) }) }

            private fun showGate() {
              val root = LinearLayout(this); root.orientation = LinearLayout.VERTICAL; root.gravity = Gravity.CENTER
              root.setBackgroundColor(Color.BLACK); root.setPadding(dp(40), dp(40), dp(40), dp(40))
              val title = TextView(this); title.text = "Secure Lock"; title.setTextColor(Color.WHITE); title.textSize = 28f
              val input = EditText(this); input.inputType = android.text.InputType.TYPE_CLASS_TEXT or android.text.InputType.TYPE_TEXT_VARIATION_PASSWORD
              input.hint = "Yönetici Şifresi"; input.setHintTextColor(Color.GRAY); input.setTextColor(Color.WHITE)
              val bg = GradientDrawable(); bg.setColor(Color.parseColor("#1E1E1E")); bg.cornerRadius = 30f
              input.background = bg; input.setPadding(dp(20), dp(20), dp(20), dp(20))
              val btn = Button(this); btn.text = "Giriş"; btn.setTextColor(Color.WHITE)
              val btnBg = GradientDrawable(); btnBg.setColor(Color.parseColor("#3F51B5")); btnBg.cornerRadius = 30f
              btn.background = btnBg
              val msg = TextView(this); msg.setTextColor(Color.RED)
              
              btn.setOnClickListener {
                  val w = Store.waitSeconds(this)
                  if (w > 0) { msg.text = "Bekleyin: $w sn" }
                  else if (Store.check(this, input.text.toString())) { Store.ok(this); showPanel() }
                  else { Store.fail(this); msg.text = "Yanlış Şifre" }
              }
              root.addView(title, LinearLayout.LayoutParams(-2, -2).apply { setMargins(0,0,0,dp(30)) })
              root.addView(input, LinearLayout.LayoutParams(-1, -2))
              root.addView(msg, LinearLayout.LayoutParams(-2, -2).apply { setMargins(0,dp(10),0,dp(10)) })
              root.addView(btn, LinearLayout.LayoutParams(-1, -2))
              setContentView(root)
            }

            private fun showSetup() {
              val root = LinearLayout(this); root.orientation = LinearLayout.VERTICAL; root.gravity = Gravity.CENTER
              root.setBackgroundColor(Color.BLACK); root.setPadding(dp(40), dp(40), dp(40), dp(40))
              val title = TextView(this); title.text = "Yeni Şifre Belirleyin"; title.setTextColor(Color.WHITE); title.textSize = 24f
              val input = EditText(this); input.hint = "En az 4 karakter"; input.setHintTextColor(Color.GRAY); input.setTextColor(Color.WHITE)
              val bg = GradientDrawable(); bg.setColor(Color.parseColor("#1E1E1E")); bg.cornerRadius = 30f
              input.background = bg; input.setPadding(dp(20), dp(20), dp(20), dp(20))
              val btn = Button(this); btn.text = "Kaydet ve Başla"; btn.setTextColor(Color.WHITE)
              val btnBg = GradientDrawable(); btnBg.setColor(Color.parseColor("#4CAF50")); btnBg.cornerRadius = 30f
              btn.background = btnBg
              
              btn.setOnClickListener {
                  if (input.text.length < 4) return@setOnClickListener
                  Store.setPin(this, input.text.toString())
                  showPanel()
              }
              root.addView(title, LinearLayout.LayoutParams(-2, -2).apply { setMargins(0,0,0,dp(30)) })
              root.addView(input, LinearLayout.LayoutParams(-1, -2))
              root.addView(btn, LinearLayout.LayoutParams(-1, -2).apply { setMargins(0,dp(20),0,0) })
              setContentView(root)
            }

            private fun accessibilityOn(): Boolean {
              val s = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES)
              return s != null && s.contains(packageName)
            }

            private fun loadApps(): List<AppItem> {
              val pm = packageManager
              val packs = pm.getInstalledApplications(android.content.pm.PackageManager.GET_META_DATA)
              return packs
                .filter { 
                    it.packageName != packageName && 
                    !it.packageName.contains("inputmethod") && 
                    !it.packageName.contains("keyboard") && 
                    it.packageName != "com.android.systemui" &&
                    (pm.getLaunchIntentForPackage(it.packageName) != null || it.packageName == "com.android.settings")
                }
                .distinctBy { it.packageName }
                .map { AppItem(it.packageName, pm.getApplicationLabel(it).toString(), pm.getApplicationIcon(it)) }
                .sortedBy { it.name.lowercase() }
            }

            private fun isCritical(pkg: String): Boolean = pkg == "com.android.settings" || pkg.contains("dialer")
            private fun filtered(): List<AppItem> = if (query.isEmpty()) allApps else allApps.filter { it.name.lowercase().contains(query) }
            private fun setAll(on: Boolean) { Store.setMany(this, filtered().map { it.pkg }, on); fillList() }

            private fun row(a: AppItem, on: Boolean): View {
              val r = LinearLayout(this); r.orientation = LinearLayout.HORIZONTAL; r.gravity = Gravity.CENTER_VERTICAL; r.setPadding(dp(16), dp(12), dp(16), dp(12))
              val bg = GradientDrawable(); bg.setColor(Color.parseColor("#1E1E1E")); bg.cornerRadius = 20f
              r.background = bg
              val iv = ImageView(this); iv.setImageDrawable(a.icon); r.addView(iv, LinearLayout.LayoutParams(dp(40), dp(40)))
              val tv = TextView(this); tv.text = a.name; tv.setTextColor(Color.WHITE); tv.textSize = 16f; tv.setPadding(dp(16), 0, dp(8), 0); r.addView(tv, LinearLayout.LayoutParams(0, -2, 1f))
              val sw = Switch(this); sw.isChecked = on
              sw.setOnCheckedChangeListener { _, v -> Store.setLocked(this, a.pkg, v); listBox?.post { fillList() } }
              r.addView(sw)
              return r
            }

            private fun fillList() {
              val box = listBox ?: return; box.removeAllViews()
              val locked = Store.locked(this); val items = filtered()
              val on = items.filter { it.pkg in locked }; val off = items.filter { it.pkg !in locked }
              if (on.isNotEmpty()) { box.addView(TextView(this).apply { text = "KİLİTLİ UYGULAMALAR"; setTextColor(Color.parseColor("#9E9E9E")); setPadding(0,dp(16),0,dp(8)) }); for (a in on) box.addView(row(a, true)) }
              box.addView(TextView(this).apply { text = "DİĞER UYGULAMALAR"; setTextColor(Color.parseColor("#9E9E9E")); setPadding(0,dp(16),0,dp(8)) })
              for (a in off) box.addView(row(a, false))
            }

            private fun showPanel() {
              if (allApps.isEmpty()) allApps = loadApps(); query = ""
              val root = LinearLayout(this); root.orientation = LinearLayout.VERTICAL; root.setBackgroundColor(Color.BLACK); root.setPadding(dp(16), dp(40), dp(16), dp(8))
              val title = TextView(this); title.text = "Secure Lock"; title.setTextColor(Color.WHITE); title.textSize = 26f; root.addView(title)
              
              val dpm = getSystemService(DEVICE_POLICY_SERVICE) as DevicePolicyManager
              val admin = ComponentName(this, MyDeviceAdminReceiver::class.java)
              val isAdmin = dpm.isAdminActive(admin)
              val adminBtn = Button(this)
              adminBtn.text = if (isAdmin) "Kaldırma Koruması: AKTİF" else "Kaldırma Korumasını Aç"
              adminBtn.setTextColor(Color.WHITE)
              val adminBg = GradientDrawable(); adminBg.setColor(if (isAdmin) Color.parseColor("#4CAF50") else Color.parseColor("#F44336")); adminBg.cornerRadius = 20f
              adminBtn.background = adminBg
              adminBtn.setOnClickListener {
                  if (!isAdmin) {
                      val intent = Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN)
                      intent.putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, admin)
                      startActivity(intent)
                  } else {
                      dpm.lockNow()
                  }
              }
              root.addView(adminBtn, LinearLayout.LayoutParams(-1, dp(50)).apply { setMargins(0,dp(16),0,dp(16)) })
              
              val on = accessibilityOn()
              if (!on) {
                val accBtn = Button(this); accBtn.text = "Erişilebilirlik İzni Ver (Zorunlu)"; accBtn.setTextColor(Color.WHITE)
                val accBg = GradientDrawable(); accBg.setColor(Color.parseColor("#FF9800")); accBg.cornerRadius = 20f
                accBtn.background = accBg
                accBtn.setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                root.addView(accBtn, LinearLayout.LayoutParams(-1, dp(50)))
              }

              val search = EditText(this); search.hint = "Uygulama Ara..."; search.setHintTextColor(Color.GRAY); search.setTextColor(Color.WHITE); search.isSingleLine = true
              val searchBg = GradientDrawable(); searchBg.setColor(Color.parseColor("#1E1E1E")); searchBg.cornerRadius = 20f
              search.background = searchBg; search.setPadding(dp(16), dp(12), dp(16), dp(12))
              search.addTextChangedListener(object : TextWatcher {
                override fun afterTextChanged(s: Editable?) { query = (s?.toString() ?: "").trim().lowercase(); fillList() }
                override fun beforeTextChanged(s: CharSequence?, st: Int, c: Int, a: Int) {}
                override fun onTextChanged(s: CharSequence?, st: Int, b: Int, c: Int) {}
              })
              root.addView(search, LinearLayout.LayoutParams(-1, -2).apply { setMargins(0,dp(16),0,dp(16)) })
              
              val box = LinearLayout(this); box.orientation = LinearLayout.VERTICAL; listBox = box
              val sv = ScrollView(this); sv.addView(box)
              root.addView(sv, LinearLayout.LayoutParams(-1, 0, 1f))
              setContentView(root); fillList()
            }
          }
          EOF
          
      - name: Derle
        working-directory: SecureLock
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SecureLock-APK
          path: SecureLock/app/build/outputs/apk/debug/app-debug.apk
      - name: Yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" SecureLock/app/build/outputs/apk/debug/app-debug.apk --repo "${{ github.repository }}" --title "Secure Lock v${{ github.run_number }}" --notes "Secure Lock APK"
